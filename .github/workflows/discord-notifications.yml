name: Discord Notifications

on:
  issues:
    types: [opened]

  pull_request:
    types: [opened]

jobs:
  notify:
    runs-on: ubuntu-latest

    steps:
      - name: Notify Discord
        uses: tsickert/discord-webhook@v7.0.0
        with:
          webhook-url: ${{ secrets.DISCORD_WEBHOOK_URL }}

          username: AI Go Teacher

          avatar-url: https://github.com/EthanPan-code.png

          embed-title: |
            ${{ github.event_name == 'issues' && ' New Issue' || ' New Pull Request' }}

          embed-url: |
            ${{ github.event.issue.html_url || github.event.pull_request.html_url }}

          embed-description: |
            **${{ github.event.issue.title || github.event.pull_request.title }}**

            Opened by **${{ github.actor }}**

            Repository: `${{ github.repository }}`

          embed-timestamp: ${{ github.event.issue.created_at || github.event.pull_request.created_at }}